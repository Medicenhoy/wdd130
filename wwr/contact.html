<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar Rafting</title>
    <meta name="description"
        content="Contact Dry Oar Rafting for inquiries, reservations, and feedback. We are here to help you plan your next adventure.">
    <meta name="author" content="Eloy Francisco Martinez Cabello">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/wwr-logo.png" alt="Dry Oar Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </div>

        <div class="contact-grid">

            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d49884.77294783845!2d-121.33271382078034!3d38.60751223271936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809adc4ba969193d%3A0xaf4500d8eb875c0!2sEffie%20Yeaw%20Nature%20Center!5e0!3m2!1ses!2sbr!4v1764385978862!5m2!1ses!2sbr"
                    allowfullscreen="" loading="lazy" title="map">
                </iframe>
            </div>

            <form action="#" method="get" class="contact-form">
                <h2>Get In Touch</h2>

                <label for="username">Name</label>
                <input type="text" id="username" name="username" placeholder="Your Name" required>

                <label for="useremail">Email</label>
                <input type="email" id="useremail" name="useremail" placeholder="Your Email" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                    </div>
                </fieldset>

                <label for="usermessage">Message</label>
                <textarea id="usermessage" name="usermessage" rows="4"
                    placeholder="Type your message here..."></textarea>

                <div class="checkbox-container">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/Employee 1.jpg" alt="Employee 1">
                    <figcaption>Jim - Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/Employee 2.jpg" alt="Employee 2">
                    <figcaption>Sarah - Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/Employee 3.jpg" alt="Employee 3">
                    <figcaption>Mike - Safety</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 Dry Oar Rafting | Eloy Francisco Martinez Cabello</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook-logo.svg" alt="Link to my Facebook page">
            </a>

            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin-logo.svg" alt="Link to my LinkedIn profile">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram-logo.svg" alt="Link to my Instagram page">
            </a>
        </nav>
    </footer>

</body>

</html>
